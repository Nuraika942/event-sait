{% extends "base.html" %}
{% block content %}
<h2><i class="fas fa-calendar-check"></i> Все мероприятия (админ-панель)</h2>
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr><th>Название</th><th>Дата</th><th>Пользователь</th><th>Действия</th></tr>
                </thead>
                <tbody>
                {% for ev in events %}
                <tr>
                    <td>{{ ev.title }}</td>
                    <td>{{ ev.event_date }}</td>
                    <td>{{ ev.author.username }}</td>
                    <td>
                        <a href="{{ url_for('event_detail', id=ev.id) }}" class="btn btn-sm btn-info"><i class="fas fa-eye"></i></a>
                        <form method="POST" action="{{ url_for('event_delete', id=ev.id) }}" class="d-inline" onsubmit="return confirm('Удалить мероприятие?')">
                            <button class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
