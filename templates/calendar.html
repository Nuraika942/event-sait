{% extends "base.html" %}
{% block content %}
<h2 class="mb-3"><i class="fas fa-calendar-alt me-2"></i> Календарь мероприятий</h2>
<div class="d-flex justify-content-between align-items-center mb-4">
    <a href="{{ url_for('calendar_view', year=prev_year, month=prev_month) }}" class="btn btn-outline-secondary"><i class="fas fa-chevron-left"></i> Пред.</a>
    <h4 class="m-0">{{ current_month }}/{{ current_year }}</h4>
    <a href="{{ url_for('calendar_view', year=next_year, month=next_month) }}" class="btn btn-outline-secondary">След. <i class="fas fa-chevron-right"></i></a>
</div>

<div class="table-responsive">
    <table class="table table-bordered text-center align-middle bg-white rounded shadow-sm">
        <thead class="table-light">
            <tr>
                <th>Пн</th><th>Вт</th><th>Ср</th><th>Чт</th><th>Пт</th><th>Сб</th><th>Вс</th>
            </tr>
        </thead>
        <tbody>
            {% for week in weeks %}
            <tr>
                {% for day in week %}
                <td class="calendar-day p-2 {% if not day.current %}bg-light text-muted{% endif %}" style="height: 100px; vertical-align: top;">
                    <div class="fw-bold">{{ day.day }}</div>
                    {% for event in day.events %}
                        <div class="small mt-1">
                            <a href="{{ url_for('event_detail', id=event.id) }}" class="text-decoration-none">
                                <i class="fas fa-circle" style="font-size: 0.6rem; color: var(--primary);"></i> {{ event.title }}
                            </a>
                        </div>
                    {% endfor %}
                </td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
