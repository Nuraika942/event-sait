{% extends "base.html" %}
{% block content %}
<h2><i class="fas fa-users"></i> Управление пользователями</h2>
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Имя</th><th>Email</th><th>Роль</th><th>Действия</th></tr>
                </thead>
                <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u.id }}</td>
                    <td><i class="fas fa-user-circle"></i> {{ u.username }}</td>
                    <td>{{ u.email }}</td>
                    <td><span class="badge bg-{{ 'primary' if u.role=='admin' else 'secondary' }}">{{ u.role }}</span></td>
                    <td>
                        {% if u.id != current_user.id %}
                        <form method="POST" action="{{ url_for('admin_delete_user', id=u.id) }}" onsubmit="return confirm('Удалить пользователя и все его мероприятия?')">
                            <button class="btn btn-sm btn-danger"><i class="fas fa-trash"></i> Удалить</button>
                        </form>
                        {% else %}
                        <span class="text-muted">Вы</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
